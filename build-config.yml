schemaVersion: 1
sources:
  - model/**/*.rosetta
references:
  cdm:
    repository: https://github.com/finos/common-domain-model
    release: 7.8.0
targets:
  typescript:
    generator: typescript
    output: generated/typescript
    namespaces:
      - example.starter
      - example.cdm
      - example.cdm.implementation
    options:
      layout: single-file
  schema:
    generator: json-schema
    output: generated/schema
    namespaces:
      - example.starter
      - example.cdm
      - example.cdm.implementation
overrides:
  - kind: declaration
    source:
      model: cdm
      namespace: cdm.base.datetime
      kind: RosettaFunction
      name: PopOffDateList
    replacement:
      model: local
      namespace: example.cdm.implementation
      kind: RosettaFunction
      name: PopOffDateListRune
