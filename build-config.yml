schemaVersion: 1
sources:
  - model/**/*.rosetta
references:
  cdm:
    repository: https://github.com/finos/common-domain-model
    release: 7.9.0
targets:
  typescript:
    generator: typescript
    output: generated/typescript
    namespaces:
      - example.starter
      - example.cdm
      - example.cdm.implementation
    options:
      layout: per-namespace
  schema:
    generator: json-schema
    output: generated/schema
    namespaces:
      - example.starter
      - example.cdm
      - example.cdm.implementation
overrides:
  - kind: resource
    source:
      model: local
      id: example.starter.CurrencyCode#RosettaTypeAlias
    path: resources/currency.json
    codeList:
      format: json
    provenance:
      model: currency-list
      repository: https://github.com/umpirsky/currency-list
      release: 4ab0b8244b44aa41fc859809e90d6e9fe00ae59e
      commit: 4ab0b8244b44aa41fc859809e90d6e9fe00ae59e
      path: data/en/currency.json
